<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marco — Portafolio</title>
<meta name="description" content="Portafolio de proyectos de ingeniería industrial: operaciones, datos y logística.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{--papel:#FFFDF9;--lino:#EFEADF;--gris-1:#8A8A80;--gris-2:#6A6A61;--gris-3:#46463F;--gris-6:#1C1C1A;--rojo:#D8231E;--rojo-hover:#A81813;--border-soft:rgba(28,28,26,.14);--mono:"JetBrains Mono",ui-monospace,monospace;--s3:14px;--s4:28px;--s5:44px;--s6:72px}*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--papel);color:var(--gris-6);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}a{color:var(--rojo);text-decoration:none}a:hover{color:var(--rojo-hover)}.home{position:relative;height:100vh;display:grid;grid-template-columns:1fr 1fr}.intro{display:flex;flex-direction:column;justify-content:center;gap:var(--s5);padding:0 var(--s6)}.intro-head{display:flex;flex-direction:column;gap:var(--s3)}.accent-bar{width:26px;height:3px;background:var(--rojo)}h1{margin:0;display:flex;flex-direction:column;gap:6px;text-wrap:pretty}.eyebrow{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--gris-2)}.name{font-size:clamp(56px,7.5vw,92px);line-height:.94;font-weight:700;letter-spacing:-.02em}.dot{color:var(--rojo)}.actions{display:flex;gap:var(--s3)}.btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:background 120ms linear,color 120ms linear,border-color 120ms linear}.btn-outline{background:transparent;color:var(--gris-6);border-color:var(--gris-6)}.btn-outline:hover{border-color:var(--rojo);color:var(--rojo)}.btn-solid{background:var(--gris-6);color:var(--papel)}.btn-solid:hover{background:var(--rojo);color:var(--papel)}.reel{height:100vh;overflow-y:auto;padding-right:var(--s6);scrollbar-width:none}.reel::-webkit-scrollbar{width:0;height:0}.loop{display:flex;flex-direction:column;gap:var(--s4);padding-top:var(--s4)}.card{display:flex;flex-direction:column;gap:var(--s3);color:inherit;width:100%;max-width:460px;margin:0 auto}.card:hover{color:inherit}.art{position:relative;width:100%;max-width:420px;aspect-ratio:16/10;margin:0 auto;background:var(--lino);border:1px solid var(--border-soft);border-radius:16px;overflow:hidden;background-image:repeating-linear-gradient(45deg,transparent 0 7px,rgba(28,28,26,.11) 7px 8px)}.card:hover .art{animation:hatch-drift 2.6s linear infinite}@keyframes hatch-drift{from{background-position:0 0}to{background-position:34px 0}}.art-label{position:absolute;left:20px;bottom:18px;padding:6px 10px;border-radius:8px;background:var(--papel);border:1px solid var(--border-soft);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris-2)}.card-text{display:flex;flex-direction:column;gap:9px}.card h3{margin:0;font-size:23px;line-height:1.28;font-weight:500;color:var(--gris-6);transition:color 120ms linear}.card:hover h3{color:var(--rojo)}.card p{margin:0;max-width:520px;font-size:14px;line-height:1.75;color:var(--gris-3)}.result{color:var(--rojo);font-weight:500}.dots{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}.dots i{width:3px;height:3px;background:var(--gris-1)}.dots i.on{width:5px;height:5px;background:var(--rojo)}@media (max-width:860px){body{overflow:auto}.home{height:auto;grid-template-columns:1fr}.intro{padding:var(--s6) var(--s4) var(--s5)}.reel{height:auto;overflow:visible;padding:0 var(--s4) var(--s6)}.loop:not(:first-child){display:none}.card{transform:none!important;opacity:1!important}.dots{display:none}}

.art-illustration {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}
</style>
</head>
<body>
<main class="home">
<section class="intro">
<div class="intro-head">
<span class="accent-bar"></span>
<h1>
<span class="eyebrow">Hola, me llamo</span>
<span class="name">Marco<span class="dot">.</span></span>
</h1>
</div>
<nav class="actions" aria-label="Secciones">
<a class="btn btn-outline" href="#" aria-label="Sobre mí">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
</a>
<a class="btn btn-solid" href="#" aria-label="Contacto">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
</a>
</nav>
</section>
<div class="reel" id="reel" aria-label="Proyectos"></div>
<div class="dots" aria-hidden="true"><i></i><i></i><i class="on"></i></div>
</main>
<script>const PROYECTOS = [
{ title: "Tercerización del transporte de devoluciones",
summary: "Diseñé el modelo operativo tercerizado y comparé el costo por tarima contra la flota propia.",
result: "Debajo de 4 tarimas, tercerizar.",
illustration: "assets/svg/c-huellas-tinta.svg",
art: "Proyecto Profesional", href: "LTL/index.html" },
{ title: "Tercerización del transporte a almacenes",
summary: "Identifiqué y comparé costos entre dos proveedores de transporte.",
result: "El cambio total aumentaba el costo un 16.26%",
illustration: "assets/svg/e-arbol-decision.svg",
art: "Proyecto Profesional", href: "FTL/index.html" },
];
const reel = document.getElementById("reel");
function card(p) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = p.href || "#";

  a.innerHTML =
    '<div class="art">' +
      '<img class="art-illustration" alt="">' +
      '<span class="art-label"></span>' +
    '</div>' +
    '<div class="card-text">' +
      '<h3></h3>' +
      '<p><span class="sum"></span> <span class="result"></span></p>' +
    '</div>';

  const img = a.querySelector(".art-illustration");

  img.src = p.illustration;
  img.alt = p.title;
  img.loading = "lazy";

  a.querySelector(".art-label").textContent = p.art;
  a.querySelector("h3").textContent = p.title;
  a.querySelector(".sum").textContent = p.summary;
  a.querySelector(".result").textContent = p.result;

  return a;
}
for (let i = 0; i < 3; i++) {
const loop = document.createElement("div");
loop.className = "loop";
PROYECTOS.forEach(p => loop.appendChild(card(p)));
reel.appendChild(loop);
}
const desktop = () => window.matchMedia("(min-width:861px)").matches;
const cards = () => reel.querySelectorAll(".card");
const centerOf = c => c.offsetTop - reel.offsetTop + c.offsetHeight / 2;
function paint() {
if (!desktop()) return;
const half = reel.clientHeight / 2;
const mid = reel.scrollTop + half;
cards().forEach(c => {
const d = Math.min(1, Math.abs(centerOf(c) - mid) / half);
const e = d * d;
c.style.transformOrigin = "center center";
c.style.transform = "scale(" + (1 - 0.26 * e).toFixed(4) + ")";
c.style.opacity = (1 - 0.75 * e).toFixed(3);
});
}
function snap() {
if (!desktop()) return;
const mid = reel.scrollTop + reel.clientHeight / 2;
let best = null;
cards().forEach(c => {
const d = centerOf(c) - mid;
if (best === null || Math.abs(d) < Math.abs(best)) best = d;
});
if (best !== null) reel.scrollTop += best;
paint();
}
let raf = 0;
function onScroll() {
if (!desktop()) return;
const h = reel.scrollHeight / 3;
if (h) {
if (reel.scrollTop >= 2 * h) reel.scrollTop -= h;
else if (reel.scrollTop < h * 0.5) reel.scrollTop += h;
}
if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); });
}
reel.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", onScroll);
requestAnimationFrame(() => requestAnimationFrame(() => {
if (!desktop()) return;
reel.scrollTop = reel.scrollHeight / 3;
snap();
}));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(snap);</script>
</body>
</html>
