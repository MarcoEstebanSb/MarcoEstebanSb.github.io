<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Tercerización de transporte: cambio de proveedor descartado</title>
<desc id="d">Árbol de decisión hecho de carreteras: los trailers que intentan cambiar de proveedor se topan con una barrera de costo (C1 mayor que C0) y otra legal (viabilidad cero); el trailer del proveedor actual sigue recto.</desc>
